# AI 督学馆 - 本地开发/练手部署编排
# 用法: docker compose up -d  (api 本地构建)
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aidushu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidushu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidushu_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aidushu}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidushu}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aidushu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidushu-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-aidushu}:${POSTGRES_PASSWORD:-aidushu_dev_pass}@postgres:5432/${POSTGRES_DB:-aidushu}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      UPLOAD_DIR: /app/uploads
      SMS_PROVIDER: mock
      AI_PROVIDER: mock
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads

  adminer:
    image: adminer:latest
    container_name: aidushu-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redisdata:
  uploads:
